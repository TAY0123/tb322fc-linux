# TB322FC / Snapdragon 8 Elite, all eight cores verified on 2026-10-31.
# No SVE/SVE2, MOPS or userspace WFxT. Never use -march=native on OBS.
# The inherited '*' flags still supply openSUSE's optimization/hardening/LTO.
Optflags: aarch64 -mbranch-protection=standard -mcpu=oryon-1+rng+fp16

Macros:
# Kernel/KMP builds use KCFLAGS instead of the userspace optflags macro.
%tb322fc_cflags -mcpu=oryon-1+rng+fp16
# Rust uses the LLVM feature name 'rand' for GCC/Clang's '+rng'.
%tb322fc_rustflags -C target-cpu=oryon-1 -C target-feature=+rand,+fp16
:Macros
